name: Build Electron App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub Release'
        type: boolean
        default: false

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            dashboard/package-lock.json
            electron/package-lock.json

      - name: Generate icons from SVG
        run: |
          brew install librsvg imagemagick
          rsvg-convert -w 1024 -h 1024 electron/assets/icon.svg -o /tmp/icon-1024.png
          # macOS .icns
          mkdir /tmp/icon.iconset
          for size in 16 32 64 128 256 512; do
            rsvg-convert -w $size -h $size electron/assets/icon.svg -o /tmp/icon.iconset/icon_${size}x${size}.png
            rsvg-convert -w $((size*2)) -h $((size*2)) electron/assets/icon.svg -o /tmp/icon.iconset/icon_${size}x${size}@2x.png
          done
          iconutil -c icns /tmp/icon.iconset -o electron/assets/icon.icns
          # Standard PNG for tray fallback
          cp /tmp/icon-1024.png electron/assets/icon.png

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Install electron dependencies
        working-directory: electron
        run: npm ci

      - name: Build macOS app
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-builds
          path: |
            electron/dist/*.dmg
            electron/dist/*.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            dashboard/package-lock.json
            electron/package-lock.json

      - name: Generate Windows icon
        shell: pwsh
        run: |
          # Download Inkscape portable for SVG→PNG conversion
          # Fallback: use the base PNG approach
          $svgPath = "electron\assets\icon.svg"
          # Use Node to create a minimal .ico placeholder if Inkscape unavailable
          node -e "
            const fs = require('fs');
            const path = require('path');
            // Copy tray-icon-template.png as icon.png fallback
            const tray = path.join('electron', 'assets', 'tray-icon-template.png');
            const target = path.join('electron', 'assets', 'icon.png');
            if (fs.existsSync(tray) && !fs.existsSync(target)) {
              fs.copyFileSync(tray, target);
            }
          "

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Install electron dependencies
        working-directory: electron
        run: npm ci

      - name: Build Windows app
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: electron/dist/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            dashboard/package-lock.json
            electron/package-lock.json

      - name: Generate Linux icon
        run: |
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 512 -h 512 electron/assets/icon.svg -o electron/assets/icon.png

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Install electron dependencies
        working-directory: electron
        run: npm ci

      - name: Build Linux app
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: electron/dist/*.AppImage

  release:
    needs: [build-mac, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
